<!DOCTYPE html>
<html lang="en">
<head>
<link rel="stylesheet" type="text/css" href="Basic_CSS_2.css">
    <meta charset="UTF-8">
    <title>Class Attribute Example</title>
    <style>
        .font_1 {
            color: blue;
            text-align: center;
            font-weight: bold;
        }
        .note {
            color: green;
            font-style: italic;
        }
		.my_style {
		background-color: red;
		color: blue;
		text-decoration: underline;
		font-weight: bold;
		font-size: small;
    </style>
</head>
<body>
    <h1 class=""font_1">Welcome to Class Attribute Assignment</h1>
    <p class="note">This paragraph is styled using the "note" class.</p>
    <p class="font_1">This paragraph uses the "font_1" class for bold, blue, centered text.</p>
	<p Class="my_style"> This paragraph is written in my style! </p>
	 <p class="myParagraph">This is a styled paragraph using an external CSS file.</p>
</body>
</html>
