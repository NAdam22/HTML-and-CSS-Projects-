<!DOCTYPE html>
<html>
<head>
    <title> Lists </title>
	<!-- Link CSS file -->
  <link rel="stylesheet" href="CSS_Lists.css">
</head>
<body>

    <h2>Unordered List</h2>
    <ul>
        <li>Soccer</li>
        <li>Boxing</li>
        <li>Video Games</li>
        <li>Reading</li>
    </ul>

    <h2>Ordered List</h2>
    <ol>
        <li>Wake up</li>
        <li>Brush teeth</li>
        <li>Eat breakfast</li>
        <li>Go to work/school</li>
    </ol>

</body>
</html>
