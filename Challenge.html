<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>HTML Spacing Challenge</title>
</head>
<body>

    <!-- Using <br> for line breaks -->
    <h1>Welcome to My HTML Page</h1>
    <p>This is the first line.<br>This is the second line after a break.</p>

    <!-- Using <section> for grouping content -->
    <section>
        <h2>About This Section</h2>
        <p>This content is inside a <span style="color: blue;">section</span> tag.</p>
    </section>

    <!-- Using <span> for inline styling -->
    <p>Here is a sentence with a <span style="font-weight: bold;">bold word</span> inside.</p>

    <!-- Using &nbsp; for spacing -->
    <p>Normal space vs&nbsp;&nbsp;&nbsp;extra spaces using &amp;nbsp;</p>

    <!-- Part 2: Copyright symbol -->
    <footer>
        <p>&copy; 2025 My Website. All rights reserved.</p>
    </footer>

</body>
</html>
